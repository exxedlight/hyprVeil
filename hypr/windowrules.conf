# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

windowrule = opacity 1.0, match:content 1 # images
windowrule = opacity 1.0, match:content 2 # videos


# BLUR ==> Using NO_BLUR for this apps:
windowrule = no_blur on, match:class kitty|vivaldi|vivaldi-stable|code|org.telegram.desktop



# CUSTOM DESKTOP OPACITY
windowrule = opacity 1.0 override, match:class com.exx.quickdesktop
# -----------------------------------------------------------------

# NO TRANSPARIENCY WORKSPACES
windowrule = opacity 1.0 override, match:workspace 10
windowrule = opacity 1.0 override, match:workspace 11
windowrule = opacity 1.0 override, match:workspace 12
# ---------------------------------------------------

# NO TRANSPARIENCY APPS
windowrule = opaque on, match:class org.nomacs.ImageLounge|krita|draw.io
# ---------------------------------------------------

# Kitty opacity
windowrule {
    name = KittyRules
    match:class = kitty
    opacity = 0.7 override 0.5 override
}
# ---------------------------------------------------------------

# Vivaldi
windowrule {
    name = VivaldiFileOperations
    match:class = vivaldi|vivaldi-stable
    match:title = Save File.*|Сохранить файл.*|Open File.*|Открытие файла.*
    float = on
    size = 800 600
}
windowrule {
    name = VivaldiSettings
    match:class = vivaldi-stable
    match:title = Vivaldi Settings.*|Настройки Vivaldi.*
    float = on
}
windowrule {
    name = VivaldiYoutube
    match:class = vivaldi-stable
    match:title = .*- YouTube.*
    opaque = true
}
windowrule = opacity 0.9 override 0.9 override 1 override, match:class vivaldi-stable
windowrule = opacity 0.99 override 0.9 override 1 override, match:class zen


# WAYBAR SCRIPTS
windowrule {
    name = WaybarPowerMenu
    match:class = kitty
    match:title = power-menu.sh
    float = on
    size = 400 165
    move = 1920-405 30
    animation = slide right
    dim_around = on
}
windowrule {
    name = WaybarBottomControlsSh
    match:class = kitty
    match:title = network.sh|bluetooth.sh
    float = on
    size = 800 300
    move = (1920-800)/2 1080-35-300
    animation = slide
}


# nomacs
windowrule {
    name = nomacs
    match:class = org.nomacs.ImageLounge
    float = on
    size = 1920 1080
    move = 0 0
    opaque = on
    border_size = 0
    rounding = 0
}
# Archives (FileRoller)
windowrule {
    name = FileRoller
    match:class = org.gnome.FileRoller
    float = on
}

#TG
windowrule {
    name = TelegramWorkspace
    match:class = org.telegram.desktop
    workspace = 1
}
windowrule {
    name = TelegramViewer
    match:class = org.telegram.desktop
    match:title = Просмотр медиа
    opacity = 1.0 override
    float = on
    size = 1920-10 1080-60
}

# Thunar
windowrule {
    name = ThunarRemane             # RENAME
    match:title = Rename.*|Переименовать.*
    float = on
}
windowrule {
    name = ThunerFileActions        # Files drop
    match:title = File Operation Progress.*|Действия над файлами.*
    float = on
}

# --- Gtk portal
windowrule {
    name = SaveFileGlobal
    match:title = .*Сохранить файл.*|.*Сохранение изображения.*|.*Сохранить видео.*
    float = on
    size = 800 600
}
windowrule {
    name = GtkPortal
    match:class = xdg-desktop-portal-gtk
    float = on
    size = 800 600
}



# MPV
windowrule {
    name = MPV
    match:class = mpv
    float = on
    opacity = 1.0
    border_size = 0
    rounding = 0
}

# Custom DESKTOP
windowrule {
    name = quickdesktop
    match:class = com.exx.quickdesktop
    opacity = 1.0 override
    no_blur = off
    border_size = 0
    decorate = off
    workspace = special:magic
    # dim_around = on
}


# Calc
windowrule {
    name = UnoCacl
    match:class = Calculator.Skia.Gtk
    float = on
    size = 600 600
}

# Audacious
windowrule {
    name = audacious
    match:class = Audacious
    match:title = .*Audacious.*
    float = on
    size = 900 800
    move = (1920-900)/2 35
    opacity = 0.8
    animation = slide top
    no_initial_focus = on
}
windowrule {
    name = audacious_no_splash
    match:class = Audacious
    match:title =
    no_initial_focus = on
}
windowrule {
    name = audacious_song_search
    match:class = Audacious
    match:title = Jump to Song.*|Перейти к композиции.*
    float = on
    move = 650 35
    animation = slide top
    opacity = 0.7 override 0.5 override
    dim_around = on
}




# Btop
# -- Main window => Float
windowrule {
    name = BtopPrimaryWindow
    match:class = btop-primary
    float = on
    opacity = 0.7 override
    size = 1910 1080-60
    decorate = off
    xray = 0
}
# Btop waybar panels (bottom)
windowrule {
    name = BtopCPU
    match:class = btop-waybar
    float = onVirtualBox Machine
    size = 900 300
    move = (1920-900)/2 1080-30-300
    animation = slide
    no_initial_focus = on
    border_size = 0
    no_shadow = on
    opacity = 0.75 override
    xray = 1
    no_blur = off
    persistent_size = off
}

# Satti
windowrule {
    name = satty
    match:class = com.gabm.satty
    float = on
    opaque = true
    fullscreen = on
}





# VirtualBox
windowrule {
    name = VBoxSettings
    match:class = VirtualBox|VirtualBoxVM
    match:title = .*Настройки.*
    float = on
    center = on
}
windowrule {
    name = VBoxMachineWide
    match:class = VirtualBox Machine
    float = on
    size = 1920 (1080-50)
    move = 0 25
    rounding = 0
    no_shadow = on
}





# GAMES SETTINGS
windowrule {
    name = LutrisWorkspace
    match:class = net.lutris.Lutris
    workspace = 9
}
# EXE opacity 1.0 (GAMES)
windowrule {
    name = ExeNoBorders
    match:class = .*\.exe
    border_size = 0
    rounding = 0
    workspace = 10
    opacity = 1.0 override 1.0 override 1.0 override
}
# Proton (steam_app)
windowrule {
    name = ProtonSteamApp
    match:class = steam_app_.*
    opaque = on
    workspace = 10
    border_size = 0
    rounding = 0
} 
# CheatEngine
windowrule {
    name = CheatEngine
    match:class = cheatengine-x86_64.exe
    workspace = 8
}
