# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules


windowrule = opacity 1.0, match:content 1 # images
windowrule = opacity 1.0, match:content 2 # videos

windowrule = opacity 1.0 override, match:class com.exx.quickdesktop


windowrule = opacity 1.0 override, match:workspace 10

# Kitty
windowrule = opacity 0.7 override 0.5 override, match:class kitty
# VS Code
# windowrule = opacity 0.8 override 0.5 override, match:class code

# Vivaldi
windowrule {
    name = VivaldiSaveFile
    match:class = vivaldi-stable
    match:title = Сохранить файл.*
    float = on
    size = 800 600
}
windowrule {
    name = VivaldiSettings
    match:class = vivaldi-stable
    match:title = Настройки Vivaldi.*
    float = on
}
windowrule = opacity 0.9 override 0.9 override 1 override, match:class vivaldi-stable


# WAYBAR SCRIPTS
windowrule {
    name = WaybarPowerMenu
    match:class = kitty
    match:title = power-menu.sh
    float = on
    size = 400 165
    move = 1920-410 35
    animation = popin
}
windowrule {
    name = WaybarWiFi
    match:class = kitty
    match:title = network.sh
    float = on
    size = 800 300
    move = (1920-800)/2 1080-35-300
    animation = slide
}
windowrule {
    name = WaybarBluetooth
    match:class = kitty
    match:title = bluetooth.sh
    float = on
    size = 800 300
    move = (1920-800)/2 1080-35-300
    animation = slide
}


# nomacs
windowrule {
    name = nomacs
    match:class = org.nomacs.ImageLounge
    float = on
    size = 1920 1080
    move = 0 0
    opacity = 1.0
    border_size = 0
    rounding = 0
}
# Archives (FileRoller)
windowrule {
    name = FileRoller
    match:class = org.gnome.FileRoller
    float = on
    size = 1200 800
}

#TG
windowrule {
    name = TelegramViewer
    match:class = org.telegram.desktop
    match:title = Просмотр медиа
    opacity = 1.0 override
    float = on
    size = 1920-10 1080-60
}
# Thunar
windowrule {
    name = ThunarRemane
    match:class = thunar
    match:title = Переименовать.*
    float = on
}


# TRANSPARENCY DISABLING
windowrule = opacity 1.0 override, match:class org.nomacs.ImageLounge
windowrule = opacity 1.0 override, match:class krita

# MPV
windowrule {
    name = MPV
    match:class = mpv
    float = on
    opacity = 1.0
    border_size = 0
    rounding = 0
}

# Custom DESKTOP
windowrule {
    name = quickdesktop
    match:class = com.exx.quickdesktop
    opacity = 1.0 override
    no_blur = on
    border_size = 0
    decorate = off
}

# Draw.io settings
windowrule = opacity 1.0 override, match:class draw.io

# EXE opacity 1.0 (GAMES)
windowrule {
    name = ExeNoBorders
    match:class = .*\.exe
    border_size = 0
    rounding = 0
    workspace = 10
}
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class .*\.exe

# Telegram
# windowrule = float on, match:class org.telegram.desktop, match:title Просмотр медиа

# Audacious
windowrule {
    name = audacious
    match:class = Audacious
    match:title = .*Audacious$
    float = on
    size = 900 800
    move = (1920-900)/2 45
    opacity = 0.8
}

# GAMES SETTINGS
windowrule = opacity 1.0 override, match:class steam
windowrule = opacity 1.0 override, match:class steam_app_4234670
#windowrulev2 = opacity 1.0, title:The\s+Last\s+Barbarian