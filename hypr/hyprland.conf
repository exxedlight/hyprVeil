# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
# -------------------------------------------------------------------------------
exec-once = waybar -c ~/.config/waybar/topbar/config.jsonc -s ~/.config/waybar/topbar/style.css &
exec-once = waybar -c ~/.config/waybar/bottombar/config.jsonc -s ~/.config/waybar/bottombar/style.css &
exec-once = hyprpaper &
exec-once = sleep 10 && audacious &
exec-once = mako &
exec-once = bluetoothctl power off >/dev/null
exec-once = ~/OWN/PyDesktop/main.py &
exec-once = ~/Env/Scripts/power-monitor.sh &
exec-once = ~/.config/waybar/scripts/power-plan-change.sh balanced
exec-once = hyprctl setcursor Future-cyan-cursors 18



