# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
# -------------------------------------------------------------------------------
exec-once = waybar &
exec-once = waybar -c ~/.config/waybar_bottom/config.jsonc -s ~/.config/waybar_bottom/style.css &
exec-once = hyprpaper &
exec-once = sleep 10 && audacious &
exec-once = mako &
exec-once = ~/Env/Scripts/power-monitor.sh &
exec-once = bluetoothctl power off >/dev/null
# DESKTOP ON special:magic workspace
exec-once = hyprctl dispatch togglespecialworkspace magic
exec-once = ~/OWN/PyDesktop/main.py &
exec-once = hyprctl dispatch togglespecialworkspace magic
