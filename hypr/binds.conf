# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q,  exec, $terminal
bind = $mainMod, C,  killactive
bind =      ALT, F4, killactive
bind = $mainMod, M,  exit,
bind = $mainMod, E,  exec, $fileManager
bind = $mainMod, F,  togglefloating
bind = $mainMod, R,  exec, $menu
bind = $mainMod, P,  pseudo,        # dwindle
bind = $mainMod, J,  togglesplit,   # dwindle


# Clipboard manager (cliphist)
bind = SUPER, V, exec, cliphist list | wofi --dmenu --pre-display-cmd "echo '%s' | cut -f 2" | cliphist decode | wl-copy


# Active window opacity toogle
bind = $mainMod, O, setprop, active opaque toggle

# Power
bind = $mainMod CTRL, 1, exec, ~/.config/waybar/scripts/power-plan-change.sh eco
bind = $mainMod CTRL, 2, exec, ~/.config/waybar/scripts/power-plan-change.sh balanced
bind = $mainMod CTRL, 3, exec, ~/.config/waybar/scripts/power-plan-change.sh performance
bind = $mainMod, H, exec, ~/.config/waybar/scripts/hypridle-toogle.sh


# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = ALT, TAB, workspace, e+1
#bind = ALT, TAB, exec, ~/Env/Scripts/alt-tab.sh
# -- Mouse wheel:
bind = $mainMod, mouse_down, workspace, -1
bind = $mainMod, mouse_up, workspace, +1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
# -- Mouse wheel:
bind = $mainMod SHIFT, mouse_down, movetoworkspace, -1
bind = $mainMod SHIFT, mouse_up, movetoworkspace, +1

# ------------------------------------------- #
#               SPECIAL WORKSPACES            #
# ------------------------------------------- #
bind = $mainMod, D, togglespecialworkspace, magic
bind = $mainMod SHIFT, D, movetoworkspace, special:magic


# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# -- Aspire 5 Fn alternative:
bindel = $mainMod, up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mainMod, down, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindel = $mainMod, right, exec, brightnessctl -e4 -n2 set 5%+
bindel = $mainMod, left, exec, brightnessctl -e4 -n2 set 5%-



# PLAYER BINDS
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
# -- Main player controls:
bindl = CTRL, F2, exec, playerctl -p audacious next
bindl = CTRL, SPACE, exec, playerctl -p audacious play-pause
bindl = CTRL, F1, exec, playerctl -p audacious previous



# LOCK / SLEEP
bindl = $mainMod, F1, exec, hyprlock & sleep 0.5; systemctl suspend # SLEEP
bind = $mainMod, L, exec, hyprlock                                  # Just lock
bindl = $mainMod, F7, exec, hyprctl dispatch dpms toggle            # Screen on/off



# Restarters
bind = $mainMod SHIFT, R, exec, killall waybar; waybar -c ~/.config/waybar/topbar/config.jsonc -s ~/.config/waybar/topbar/style.css & disown; waybar -c ~/.config/waybar/bottombar/config.jsonc -s ~/.config/waybar/bottombar/style.css & disown
bind = $mainMod SHIFT, P, exec, ~/OWN/PyDesktop/main.py & disown


# BTOP++
bind = $mainMod SHIFT, ESCAPE, exec, kitty -e --class "btop-primary" btop -p 1



# --------------------------------------- #
#       SCREENSHOT + VIDEO CAPTURE        #
# --------------------------------------- #

# F12 screenshot
bind = , F12, exec, ~/Env/Scripts/f12screenshot.sh
# Area screenshot
bind = $mainMod SHIFT, S, exec, grimblast copy area
bind = $mainMod CTRL, S, exec, grimblast --freeze save output - | satty --disable-notifications --filename -
# PrintScreen
bindl = , Print, exec, grim - | wl-copy # SCREENSHOT (Full)
# Video capture
bind = $mainMod, F10, exec, ~/Env/Scripts/toogle-video-record.sh

